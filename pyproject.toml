[project]
name = "sentence-api"
version = "0.1.2"
description = "一言句子管理 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "jinja2>=3.1.6",
    "psycopg2-binary>=2.9.12",
    "python-multipart>=0.0.29",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
postgresql = ["psycopg2-binary"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "database.py",
    "config.py",
    "app.py",
    "convert.py",
    "static",
]
