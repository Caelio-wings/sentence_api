[project]
name = "sentence-api"
version = "0.1.3"
description = "一言句子管理 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "jinja2>=3.1.6",
    "psycopg2-binary>=2.9.12",
    "python-multipart>=0.0.29",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
postgresql = ["psycopg2-binary"]

[project.scripts]
sentence-api = "sentence_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentence_api"]
include = ["*.py", "static/**"]
